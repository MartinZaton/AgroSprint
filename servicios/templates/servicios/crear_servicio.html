<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Publicar Servicio - Nexo Agro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
    <main class="max-w-2xl mx-auto px-4 py-12">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Publicá tu Servicio Agropecuario</h1>
            <p class="text-gray-500 mb-6">Ofrecé tu trabajo, asesoría o maquinaria a productores de la zona.</p>

            <form method="POST" class="space-y-4">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Busco / Ofrezco</label>
                    {{ form.tipo_oferta }}
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Título del Anuncio</label>
                    {{ form.titulo }}
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Categoría</label>
                    {{ form.categoria }}
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Descripción del Servicio</label>
                    {{ form.descripcion }}
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Ubicación / Zona de cobertura</label>
                        {{ form.ubicacion }}
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Teléfono (con código de área)</label>
                        {{ form.contacto }}
                    </div>
                </div>

                <div class="pt-4 flex gap-4">
                    <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition">
                        Publicar Anuncio
                    </button>
                    <a href="{% url 'lista_servicios' %}" class="px-6 py-3 border border-gray-200 text-gray-500 rounded-xl hover:bg-gray-50 transition text-center">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
