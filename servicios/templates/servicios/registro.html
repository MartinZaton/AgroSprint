<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Nexo Agro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 max-w-md w-full">
        <h2 class="text-2xl font-bold text-gray-900 text-center mb-6">Crear Cuenta en NexoAgro</h2>

        <form method="POST" class="space-y-4">
            {% csrf_token %}

            <div class="text-sm text-gray-600 space-y-2">
                {{ form.as_p }}
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 rounded-xl transition mt-4">
                Registrarse
            </button>
        </form>
        <p class="text-xs text-gray-400 text-center mt-4">Las contraseñas deben ser seguras y no muy similares a tu nombre.</p>
    </div>
</body>
</html>
